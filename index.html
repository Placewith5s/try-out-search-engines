<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Try Out Search Engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Try Out Search Engines</h1>
    </header>

    <main>
        <input id="search-bar" type="search" placeholder="Search..." autocomplete="on" minlength="1">
        <img src="magnifier.png" alt="search icon" loading="lazy" fetchpriority="high">

        <select name="search-engine" id="engine-options">
            <option value="bing">Bing</option>
            <option value="brave">Brave</option>
            <option value="google">Google</option>
            <option value="mojeek">Mojeek</option>
            <option value="yandex">Yandex</option>
        </select>

        <section aria-labelledby="safe-search-settings-heading">
            <h2 id="safe-search-settings-heading">
                Safe Search Settings: (no login required)</h2>

            <a href="https://www.bing.com/account/general"
                target="_blank"
                rel="noopener noreferrer"
                title="opens in a new tab">
                Bing Settings
            </a>

            <a href="https://search.brave.com/settings"
                target="_blank"
                rel="noopener noreferrer"
                title="opens in a new tab">
                Brave Settings
            </a>

            <a href="https://www.google.com/safesearch"
                target="_blank"
                rel="noopener noreferrer"
                title="opens in a new tab">
                Google Safe Search Setting
            </a>

            <a href="https://www.mojeek.com/preferences"
                target="_blank"
                rel="noopener noreferrer"
                title="opens in a new tab">
                Mojeek Settings
            </a>
        </section>
    </main>

    <script src="script.js" defer></script>

    <footer>
        <nav>
            <a href="https://www.flaticon.com/free-icons/camera-with-zoom" title="camera with zoom icons">Camera with zoom icons created by sonnycandra - Flaticon</a>
        </nav>
    </footer>
</body>
</html>
